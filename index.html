<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ell a — IndexedDB Örneği</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    label, input, button { display: block; margin: .4rem 0; }
    ul { padding-left: 1.2rem; }
    .row { display:flex; gap:8px; align-items:center; }
    .item-actions { margin-left: auto; }
  </style>
</head>
<body>
  <h1>Ell a — Veri Ekle (IndexedDB)</h1>
  <p>Bu sayfa tarayıcı içi IndexedDB kullanarak veri ekleyip listeleyen basit bir örnektir.</p>

  <form id="itemForm">
    <label>Başlık: <input id="title" required /></label>
    <label>Açıklama: <input id="desc" /></label>
    <button type="submit">Kaydet</button>
  </form>

  <h2>Kaydedilenler</h2>
  <ul id="itemsList"></ul>
  <button id="clearBtn">Tümünü Sil</button>

  <script>
    // DB ayarları
    const DB_NAME = 'EllADb';
    const DB_VERSION = 1;
    const STORE_NAME = 'items';
    let db;

    // DB'yi aç
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (ev) => {
          db = ev.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            store.createIndex('createdAt', 'createdAt', { unique: false });
          }
        };
        req.onsuccess = (ev) => { db = ev.target.result; resolve(db); };
        req.onerror = (ev) => reject(ev.target.error);
      });
    }

    // Veri ekle
    function addItem(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.add(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // Tüm verileri al
    function getAllItems() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // Tek bir öğeyi sil
    function deleteItem(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(Number(id));
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    // Tüm öğeleri temizle
    function clearAll() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function renderItems(items) {
      const ul = document.getElementById('itemsList');
      ul.innerHTML = '';
      items.sort((a,b) => (new Date(b.createdAt)) - (new Date(a.createdAt)));
      items.forEach(it => {
        const li = document.createElement('li');
        li.className = 'row';
        const text = document.createElement('span');
        text.textContent = `${it.id}: ${it.title || '(başlıksız)'} — ${it.desc || ''}`;
        li.appendChild(text);

        const actions = document.createElement('div');
        actions.className = 'item-actions';
        const del = document.createElement('button');
        del.textContent = 'Sil';
        del.addEventListener('click', async () => {
          await deleteItem(it.id);
          refreshList();
        });
        actions.appendChild(del);
        li.appendChild(actions);

        ul.appendChild(li);
      });
    }

    async function refreshList() {
      const items = await getAllItems();
      renderItems(items);
    }

    document.getElementById('itemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();
      await addItem({ title, desc, createdAt: new Date().toISOString() });
      document.getElementById('title').value = '';
      document.getElementById('desc').value = '';
      await refreshList();
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (!confirm('Tüm verileri silmek istediğinize emin misiniz?')) return;
      await clearAll();
      await refreshList();
    });

    // Başlat
    (async () => {
      try {
        await openDb();
        await refreshList();
      } catch (err) {
        console.error('IndexedDB açılırken hata:', err);
        const p = document.createElement('p');
        p.style.color = 'red';
        p.textContent = 'IndexedDB kullanılırken hata oluştu. Tarayıcınız desteklemiyor olabilir.';
        document.body.appendChild(p);
      }
    })();
  </script>
</body>
</html>
